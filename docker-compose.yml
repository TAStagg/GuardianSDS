services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardiansds-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Override the database URL to point to the docker container 'db' instead of localhost
      - DATABASE_URL=postgresql://user:password@db:5432/guardiansds
      - NODE_ENV=production
    # Load other environment variables (like API keys) from optional .env file
    # Note: Create a .env file from .env.example if you haven't already
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: guardiansds-db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=guardiansds
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
